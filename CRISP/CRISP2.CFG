BMP->ECB,MP,FLP: %2:^MCD %3^M%0PIX2MAP -ecb -horiz -vert %4
BMP->MLT,CLR,MP: %2:^MCD %3^M%0PIX2MAP -mlt %4

PIC->LBM: %0CONVERT %2:%3\%4.PIC %2:%3\%4.LBM
NEO->LBM: %0CONVERT %2:%3\%4.NEO %2:%3\%4.LBM
