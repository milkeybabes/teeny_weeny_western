LBM->PIC: %0CONVERT %2:%3\%4.LBM %2:%3\%4.PIC
LBM->PIC (Grey): %0CONVERT -NESPAL %0GREY.PAL %2:%3\%4.LBM %2:%3\%4.PIC
LBM->PIX: %0CONVERT %2:%3\%4.LBM %2:%3\%4.PIX
LBM->BMP: %0CONVERT %2:%3\%4.LBM %2:%3\%4.BMP
LBM->NEO: %0CONVERT %2:%3\%4.LBM %2:%3\%4.NEO
LBM->PI1: %0CONVERT %2:%3\%4.LBM %2:%3\%4.PI1
LBM->SGA: %0CONVERT %2:%3\%4.LBM %2:%3\%4.SGA
LBM->GBC,MAP (1*2): %2:^MCD %3^M%0PIX2MAP -gbc -vert -horiz -blkdup -size 1 2 %4
LBM->SET,MAP (2*2): %2:^MCD %3^M%0PIX2MAP -set -blkdup -mat 2 2 %4
LBM->SCH,MAP (2*2): %2:^MCD %3^M%0PIX2MAP -sch -vert -horiz -blkdup -mat 2 2 %4
LBM->SF4,MAP (2*2): %2:^MCD %3^M%0PIX2MAP -sf4 -vert -horiz -blkdup -mat 2 2 %4
